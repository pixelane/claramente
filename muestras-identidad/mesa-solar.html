<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Claramente - Mesa solar</title>
    <link rel="stylesheet" href="muestras.css">
  </head>
  <body class="theme-solar">
    <main class="artboard solar-board" aria-label="Muestra visual Mesa solar">
      <header class="brand-row">
        <div class="mark solar-mark" aria-hidden="true"></div>
        <span>Claramente</span>
      </header>

      <section class="hero-copy">
        <p class="eyebrow">mesa solar</p>
        <h1>Una mesa, varias partes, un resultado que todos entienden.</h1>
        <p>Claramente convierte la cuenta en pagos simples antes de que alguien saque la calculadora.</p>
      </section>

      <section class="table-diagram" aria-label="Diagrama de mesa">
        <div class="plate center">Cuenta<br><strong>$5,200</strong></div>
        <div class="plate p1">Jimmy<br><strong>$2,600</strong></div>
        <div class="plate p2">Tarjeta<br><strong>cobra</strong></div>
        <div class="plate p3">Cash<br><strong>$2,600</strong></div>
        <span class="orbit orbit-one"></span>
        <span class="orbit orbit-two"></span>
      </section>

      <section class="solar-result">
        <span>Copiar resumen</span>
        <strong>2 pagos pendientes</strong>
      </section>
    </main>
  </body>
</html>
